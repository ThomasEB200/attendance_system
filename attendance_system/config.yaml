camera:
  width: 320
  height: 240
  # Set to 0 for USB webcam on PC; ignored on Pi (picamera2 is used)
  cv2_device_index: 0
  # ISP hardware controls — applied only when running on Pi with picamera2.
  # These run on the camera ISP chip (free CPU cost), so prefer these over
  # software enhance on Pi. On PC they are silently ignored.
  isp_controls:
    NoiseReductionMode: 2   # 0=off 1=fast 2=HighQuality — replaces software pre-blur
    Sharpness: 1.5          # 0–16, default=1.0 — replaces software unsharp mask
    ExposureValue: 0.0      # EV compensation: +0.5 if room is dim, -0.5 if too bright
    Contrast: 1.1           # 0–32, default=1.0
    AeEnable: true          # auto exposure — already default, explicit for clarity
    AwbEnable: true         # auto white balance — already default

enhance:
  enabled: true
  clahe_clip_limit: 1.5  # local contrast (1.0 = subtle, 3.0 = aggressive)
  clahe_tile_grid: 8     # smaller tile = more local, larger = more global
  sharpen_strength: 0.6  # 0 = off, 0.4–0.8 = phone-like, >1.0 = over-sharp
  denoise: false         # bilateral filter — helps noisy cameras, adds ~10ms/frame

detection:
  model_path: "detection/models/face_detection.tflite"
  confidence_threshold: 0.6
  min_face_size_px: 60
  stable_frames_required: 3
  # iou threshold for NMS
  nms_iou_threshold: 0.3

recognition:
  model_path: "recognition/models/face_embedding.tflite"
  known_faces_dir: "data/known_faces"
  embeddings_path: "data/embeddings.pkl"
  similarity_threshold: 0.55
  low_confidence_threshold: 0.4

sync:
  enabled: true
  # provider: local    — reads data/employees.yaml + data/employee_source/ (dev/testing)
  # provider: firebase — reads Firestore, photo stored as base64 data URI
  provider: firebase     # firebase/local
  local:
    employees_config: "employees.yaml"  # relative to data/
    source_dir: "employee_source"       # relative to data/; put reference photos here
  firebase:
    # Service account key: Firebase Console → Project Settings → Service accounts → Generate new private key
    credentials: "firebase_credentials.json"  # relative to attendance_system/

attendance:
  reset_hour: 5     # reset tất cả về "absent" lúc reset_hour:reset_minute mỗi ngày
  reset_minute: 0   # ví dụ reset_hour: 17, reset_minute: 13 → 17:13

debug:
  show_window: true
  window_name: "Attendance System — Debug"
  log_latency: true
  log_level: "INFO"  #INFO, DEBUG

# ST7735 TFT display (1.8-inch, 128×160)
# Only active on Raspberry Pi where spidev + RPi.GPIO are available.
# Set enabled: false when developing on PC.
tft:
  enabled: true             # true on Pi with TFT wired up
  dc_pin:  25               # BCM GPIO for DC/RS line   (physical pin 22)
  rst_pin: 27               # BCM GPIO for hardware RST (physical pin 13)
  bl_pin:  18               # BCM GPIO for backlight    (physical pin 12)
  scale_mode: fill          # fit | fill | stretch | none
  target_fps: 15            # max push rate (SPI ceiling ~20 fps at 16 MHz)
  spi_speed:  16000000      # SPI clock in Hz (ST7735 max ~20 MHz)
  web_preview: true         # also serve the Flask /stream while TFT is active
